[project]
name = "schemo-server"
version = "0.1.0"
description = "MCP server for engineering visualization — circuits, Bode plots, waveforms, and equations"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.3.0",
    "numpy>=2.2.3",
    "scipy>=1.15.1",
    "schemdraw>=0.19",
    "matplotlib>=3.10.0",
    "control>=0.10.2",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "sse-starlette>=2.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
